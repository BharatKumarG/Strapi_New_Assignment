version: '3.8'

services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: yii2db
      MYSQL_USER: yii2user
      MYSQL_PASSWORD: yii2pass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - yii2net

  web:
    image: yiisoftware/yii2-php:8.2-fpm
    volumes:
      - ../:/app
    depends_on:
      - db
    networks:
      - yii2net

  nginx:
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - ../:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - yii2net

volumes:
  db_data:

networks:
  yii2net:
